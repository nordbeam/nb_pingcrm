name: Frontend

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  vite-plus:
    name: Vite+ checks and bundle budgets
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: assets

    steps:
      - uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20'
          otp-version: '29'

      - name: Restore Mix cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-29-1.20-${{ hashFiles('mix.lock') }}

      - name: Install backend dependencies
        run: mix deps.get
        working-directory: .

      - name: Compile Phoenix colocated assets
        run: mix compile --warnings-as-errors
        working-directory: .

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version: '26'

      - name: Install dependencies with npm 12
        run: corepack npm@12.0.2 ci

      - name: Check formatting and lint
        run: vp check

      - name: Check TypeScript
        run: corepack npm@12.0.2 run types:check

      - name: Run frontend tests
        run: vp test --passWithNoTests
        env:
          PHOENIX_BYPASS_ENV_CHECK: '1'

      - name: Build and enforce bundle budgets
        run: corepack npm@12.0.2 run build:budget
